[package]
name = "sina"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "cookies"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
urlencoding = "2"

[profile.release]
lto = "thin"
strip = true
