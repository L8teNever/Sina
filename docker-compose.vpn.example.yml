# Sina mit VPN (z. B. Proton) über gluetun: Server UND Browser gehen über dieselbe VPN-Adresse.
# Die VPN-Datei (WireGuard .conf) lädst du in Sina unter  /settings  hoch. Schlüssel, Adresse und Server
# werden daraus gelesen, nichts davon muss hier eingetragen werden.
#
# Wichtig: Der Stream-Link eines Hosters gilt nur für die IP, die die Hoster-Seite geholt hat.
# Gehen Server und Chromium nicht über denselben Ausgang, lehnt der Hoster das Video ab.
# Die Proton-Erweiterung im Chromium wird dann nicht mehr gebraucht (sie schützt nur den Browser).
#
# Starten:  cp docker-compose.vpn.example.yml docker-compose.yml  &&  docker compose up -d
# Dann  http://<server>:8180/#/settings  öffnen und die .conf-Datei hochladen.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: sina-vpn
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
    volumes:
      - vpnconf:/gluetun/wireguard:ro     # liest wg0.conf, die Sina beim Hochladen schreibt

  # Startet gluetun neu, sobald eine neue Datei hochgeladen wurde.
  vpn-watcher:
    image: docker:cli
    restart: unless-stopped
    volumes:
      - vpnconf:/vpn:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        last=$$(stat -c %Y /vpn/wg0.conf 2>/dev/null || echo none)
        while true; do
          now=$$(stat -c %Y /vpn/wg0.conf 2>/dev/null || echo none)
          if [ "$$now" != "$$last" ]; then docker restart sina-vpn; last=$$now; fi
          sleep 5
        done

  sina:
    image: ghcr.io/l8tenever/sina:latest
    pull_policy: always
    container_name: sina
    restart: unless-stopped
    shm_size: "1gb"
    depends_on: [gluetun]
    ports:
      - "8180:8080"
      - "8181:8081"
    volumes:
      - sina-data:/data
      - vpnconf:/vpn                       # hier schreibt die Einstellungsseite die Datei hin
    environment:
      HTTPS_PROXY: http://sina-vpn:8888    # Server-Anfragen und Video-Proxy
      HTTP_PROXY: http://sina-vpn:8888
      NO_PROXY: localhost,127.0.0.1,sina-vpn
      # BROWSER_PROXY: http://sina-vpn:8888  # Chromium nutzt sonst automatisch HTTPS_PROXY
      # VIEW_PASSWORD: "geheim"
      # REQUIRE_ACCESS: "1"                  # Einstellungen nur über Cloudflare Access erlauben

volumes:
  vpnconf:
  sina-data:
