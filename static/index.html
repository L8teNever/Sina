<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1116">
<meta name="referrer" content="no-referrer">
<title>Sina</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --line:#252c38; --text:#e8ecf2; --dim:#8b95a7; --acc:#7c9cff; --acc2:#4f6fe0; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  header { position:sticky; top:0; z-index:10; display:flex; gap:12px; align-items:center; padding:10px 16px; background:rgba(14,17,22,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .logo { font-weight:700; font-size:20px; letter-spacing:.5px; color:var(--acc); }
  .search { flex:1; max-width:560px; position:relative; }
  .search input { width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; outline:none; }
  .search input:focus { border-color:var(--acc); }
  .pill { padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:14px; color:var(--dim); white-space:nowrap; }
  .pill:hover { color:var(--text); border-color:var(--acc); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .dot.up { background:#4ade80; }
  main { max-width:1100px; margin:0 auto; padding:18px 16px 60px; }
  h1,h2,h3 { margin:0 0 10px; }
  h2 { font-size:18px; color:var(--dim); font-weight:600; margin-top:26px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .card:hover { border-color:var(--acc); }
  .card .img { aspect-ratio:2/3; background:#10141b center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:38px; color:var(--line); }
  .card .t { padding:9px 11px 11px; font-size:14px; font-weight:600; }
  .card .d { padding:0 11px 11px; font-size:12px; color:var(--dim); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .series { display:flex; gap:20px; flex-wrap:wrap; }
  .series .cover { width:200px; flex:none; border-radius:14px; border:1px solid var(--line); aspect-ratio:2/3; background:var(--card) center/cover no-repeat; }
  .series .info { flex:1; min-width:260px; }
  .dim { color:var(--dim); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px; }
  .chip { padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:14px; }
  .chip.on { background:var(--acc2); border-color:var(--acc); color:#fff; }
  .chip:hover { border-color:var(--acc); }
  .eps { display:flex; flex-direction:column; gap:6px; }
  .ep { display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--card); border:1px solid var(--line); }
  .ep:hover { border-color:var(--acc); }
  .ep .n { width:34px; flex:none; color:var(--acc); font-weight:700; text-align:right; }
  .ep .tt { flex:1; min-width:0; }
  .ep .tt b { display:block; font-weight:600; font-size:15px; }
  .ep .tt small { color:var(--dim); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ep .seen { color:#4ade80; font-size:13px; }
  .player { position:relative; background:#000; border-radius:14px; overflow:hidden; aspect-ratio:16/9; }
  .player video { width:100%; height:100%; background:#000; }
  .player .msg { position:absolute; inset:0; display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:center; text-align:center; padding:20px; background:rgba(0,0,0,.72); }
  .spin { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .btn { padding:9px 16px; border-radius:10px; border:1px solid var(--acc); background:var(--acc2); color:#fff; font-weight:600; }
  .btn.ghost { background:transparent; border-color:var(--line); color:var(--text); }
  .bar { display:flex; gap:10px; align-items:center; justify-content:space-between; margin:12px 0; flex-wrap:wrap; }
  .err { color:var(--bad); }
  .empty { color:var(--dim); padding:30px 0; text-align:center; }
  .crumb { color:var(--dim); font-size:14px; margin-bottom:10px; }
  .crumb a:hover { color:var(--text); }
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">Sina</a>
  <div class="search"><input id="q" type="search" placeholder="Anime suchen …" autocomplete="off" enterkeyhint="search"></div>
  <a class="pill" id="browserLink" href="#" target="_blank" rel="noopener" title="Der Browser im Container (Schutzprüfungen lösen, Anmeldungen)"><span class="dot" id="dot"></span>Browser</a>
</header>
<main id="app"></main>

<script src="hls.min.js"></script>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('sina:' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sina:' + k, JSON.stringify(v)); } catch {} },
};
let cfg = { viewUrl: '', viewPort: '8081' };

async function api(path, params) {
  const url = '/api/' + path + (params ? '?' + new URLSearchParams(params) : '');
  const r = await fetch(url);
  let j = null;
  try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error((j && j.error) || 'Fehler ' + r.status); e.needsBrowser = !!(j && j.needsBrowser); throw e; }
  return j;
}
const coverUrl = (p) => (p ? '/api/img?p=' + encodeURIComponent(p) : '');
const viewUrl = () => cfg.viewUrl || `${location.protocol}//${location.hostname}:${cfg.viewPort}/`;

async function loadConfig() {
  try {
    cfg = await api('config');
    $('#dot').classList.toggle('up', !!cfg.browserUp);
  } catch {}
  $('#browserLink').href = viewUrl();
}
loadConfig();
setInterval(loadConfig, 30000);

// ---------- Suche ----------
const qEl = $('#q');
let qTimer = null, qSeq = 0;
qEl.addEventListener('input', () => {
  clearTimeout(qTimer);
  const v = qEl.value.trim();
  if (v.length < 2) return;
  qTimer = setTimeout(() => { if (location.hash !== '#/search/' + encodeURIComponent(v)) location.hash = '#/search/' + encodeURIComponent(v); }, 350);
});
qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const v = qEl.value.trim(); if (v.length >= 2) location.hash = '#/search/' + encodeURIComponent(v); } });

const coverQueue = [];
let coverBusy = false;
const io = new IntersectionObserver((entries) => {
  for (const en of entries) if (en.isIntersecting) { io.unobserve(en.target); coverQueue.push(en.target); }
  pump();
}, { rootMargin: '200px' });
async function pump() {
  if (coverBusy) return;
  coverBusy = true;
  while (coverQueue.length) {
    const el = coverQueue.shift();
    if (!el.isConnected) continue;
    try {
      const s = await api('series', { slug: el.dataset.slug });
      if (s.cover) el.style.backgroundImage = `url("${coverUrl(s.cover)}")`, el.textContent = '';
    } catch {}
  }
  coverBusy = false;
}

async function viewSearch(q) {
  qEl.value = q;
  const seq = ++qSeq;
  app.innerHTML = `<h1>Suche: „${esc(q)}“</h1><div class="empty"><div class="spin" style="margin:0 auto"></div></div>`;
  try {
    const res = await api('search', { q });
    if (seq !== qSeq) return;
    if (!res.length) { app.innerHTML = `<h1>Suche: „${esc(q)}“</h1><div class="empty">Nichts gefunden.</div>`; return; }
    app.innerHTML = `<h1>Suche: „${esc(q)}“</h1><div class="grid">${res.map((r) => `
      <a class="card" href="#/s/${esc(r.slug)}"><div class="img" data-slug="${esc(r.slug)}">${esc(r.title.slice(0, 1))}</div>
      <div class="t">${esc(r.title)}</div><div class="d">${esc(r.description)}</div></a>`).join('')}</div>`;
    app.querySelectorAll('.img[data-slug]').forEach((el) => io.observe(el));
  } catch (e) {
    if (seq !== qSeq) return;
    app.innerHTML = `<h1>Suche: „${esc(q)}“</h1>${errBox(e)}`;
  }
}

function errBox(e) {
  return `<div class="empty err">${esc(e.message)}${e.needsBrowser ? `<br><br><a class="btn" href="${esc(viewUrl())}" target="_blank" rel="noopener">Browser öffnen</a>` : ''}</div>`;
}

// ---------- Startseite ----------
function viewHome() {
  qEl.value = '';
  const recent = store.get('recent', []);
  app.innerHTML = recent.length
    ? `<h1>Weiter schauen</h1><div class="eps">${recent.map((r) => `
        <a class="ep" href="#/w/${esc(r.slug)}/${esc(r.season)}/${esc(r.ep)}"><span class="n">▶</span>
        <span class="tt"><b>${esc(r.title)}</b><small>${r.season === 'filme' ? 'Film' : 'Staffel ' + esc(r.season)} · Folge ${esc(r.ep)}${r.pos ? ' · bei ' + fmt(r.pos) : ''}</small></span></a>`).join('')}</div>`
    : `<div class="empty"><h1>Sina</h1>Oben einen Anime suchen.</div>`;
}
const fmt = (s) => { s = Math.floor(s); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };

// ---------- Serie ----------
async function viewSeries(slug, season) {
  app.innerHTML = `<div class="empty"><div class="spin" style="margin:0 auto"></div></div>`;
  let s;
  try { s = await api('series', { slug }); } catch (e) { app.innerHTML = errBox(e); return; }
  document.title = s.title + ' – Sina';
  const cur = season || (s.seasons.find((x) => x.key === '1') || s.seasons[0] || {}).key || '1';
  app.innerHTML = `
    <div class="series">
      <div class="cover" style="background-image:url('${coverUrl(s.cover)}')"></div>
      <div class="info"><h1>${esc(s.title)}</h1>
        <div class="dim">${esc(s.genres.join(' · '))}</div>
        <p>${esc(s.description)}</p>
        ${s.alt.length ? `<div class="dim" style="font-size:13px">Auch bekannt als: ${esc(s.alt.slice(0, 5).join(', '))}</div>` : ''}
      </div>
    </div>
    <h2>Staffeln</h2>
    <div class="chips">${s.seasons.map((x) => `<a class="chip ${x.key === cur ? 'on' : ''}" href="#/s/${esc(slug)}/${esc(x.key)}">${esc(x.label)}</a>`).join('')}</div>
    <div id="eps"><div class="empty"><div class="spin" style="margin:0 auto"></div></div></div>`;
  try {
    const eps = await api('season', { slug, season: cur });
    const seen = store.get('seen', {});
    $('#eps').innerHTML = `<div class="eps">${eps.map((e) => {
      const done = seen[`${slug}/${cur}/${e.n}`];
      return `<a class="ep" href="#/w/${esc(slug)}/${esc(cur)}/${e.n}"><span class="n">${e.n}</span>
        <span class="tt"><b>${esc(e.title || e.titleEn || 'Folge ' + e.n)}</b><small>${esc(e.titleEn && e.title ? e.titleEn : e.hosters.join(', '))}</small></span>
        ${done ? '<span class="seen">✓</span>' : ''}</a>`;
    }).join('')}</div>`;
  } catch (e) { $('#eps').innerHTML = errBox(e); }
}

// ---------- Player ----------
let hls = null;
let playTimer = null;
function stopPlayer() {
  if (hls) { try { hls.destroy(); } catch {} hls = null; }
  clearInterval(playTimer);
}

async function viewWatch(slug, season, ep) {
  app.innerHTML = `<div class="empty"><div class="spin" style="margin:0 auto"></div></div>`;
  let s, eps, info;
  try {
    [s, eps, info] = await Promise.all([api('series', { slug }), api('season', { slug, season }), api('episode', { slug, season, episode: ep })]);
  } catch (e) { app.innerHTML = errBox(e); return; }
  const num = Number(ep);
  const idx = eps.findIndex((x) => x.n === num);
  const cur = eps[idx] || { n: num, title: '', titleEn: '' };
  const prev = eps[idx - 1], next = eps[idx + 1];
  const sLabel = season === 'filme' ? 'Film' : 'Staffel ' + season;
  document.title = `${s.title} ${sLabel} · ${ep} – Sina`;

  let lang = store.get('lang', null);
  if (!info.langs.some((l) => l.key === lang)) lang = (info.langs.find((l) => l.on) || info.langs[0] || { key: info.hosters[0].lang }).key;
  const hostersFor = (k) => info.hosters.filter((h) => h.lang === k);
  let hosterId = null;

  app.innerHTML = `
    <div class="crumb"><a href="#/s/${esc(slug)}/${esc(season)}">← ${esc(s.title)}</a> · ${esc(sLabel)} · Folge ${esc(ep)}</div>
    <h1 style="font-size:20px">${esc(cur.title || cur.titleEn || 'Folge ' + ep)}</h1>
    <div class="player" id="pl"><video id="v" controls playsinline></video><div class="msg" id="msg"></div></div>
    <div class="bar">
      ${prev ? `<a class="btn ghost" href="#/w/${esc(slug)}/${esc(season)}/${prev.n}">← Folge ${prev.n}</a>` : '<span></span>'}
      ${next ? `<a class="btn" id="next" href="#/w/${esc(slug)}/${esc(season)}/${next.n}">Folge ${next.n} →</a>` : '<span></span>'}
    </div>
    <h3 class="dim" style="font-size:14px">Sprache</h3><div class="chips" id="langs"></div>
    <h3 class="dim" style="font-size:14px">Hoster</h3><div class="chips" id="hosters"></div>`;
  const v = $('#v'), msg = $('#msg');
  const say = (html) => { msg.innerHTML = html; msg.style.display = html ? 'flex' : 'none'; };

  function paintChips() {
    $('#langs').innerHTML = info.langs.map((l) => `<button class="chip ${l.key === lang ? 'on' : ''}" data-l="${esc(l.key)}">${esc(l.label)}</button>`).join('');
    $('#hosters').innerHTML = hostersFor(lang).map((h) => `<button class="chip ${h.id === hosterId ? 'on' : ''}" data-h="${esc(h.id)}">${esc(h.name)}</button>`).join('');
  }
  $('#langs').onclick = (e) => { const b = e.target.closest('[data-l]'); if (b) { lang = b.dataset.l; store.set('lang', lang); start(); } };
  $('#hosters').onclick = (e) => { const b = e.target.closest('[data-h]'); if (b) start(b.dataset.h, true); };

  const posKey = `${slug}/${season}/${ep}`;
  let startAt = (store.get('pos', {})[posKey]) || 0;
  let token = 0;

  async function start(forceId, single) {
    const my = ++token;
    stopPlayer();
    v.removeAttribute('src'); v.load();
    const list = hostersFor(lang);
    if (!list.length) { say(`<div class="err">Für diese Sprache gibt es keine Hoster.</div>`); paintChips(); return; }
    // VOE zuerst, dann der Rest
    const order = [...list].sort((a, b) => (/voe/i.test(b.name) ? 1 : 0) - (/voe/i.test(a.name) ? 1 : 0));
    const queue = forceId ? (single ? order.filter((h) => h.id === forceId) : order) : order;
    let lastErr = null;
    for (const h of queue) {
      if (my !== token) return;
      hosterId = h.id; paintChips();
      say(`<div class="spin"></div><div>Hoster ${esc(h.name)} wird geöffnet …<br><span class="dim" style="font-size:13px">Das kann bis zu einer halben Minute dauern.</span></div>`);
      try {
        const st = await api('stream', { id: h.id });
        if (my !== token) return;
        await play(st, my);
        return;
      } catch (e) {
        lastErr = e;
        if (e.needsBrowser) break;
      }
    }
    if (my !== token) return;
    say(`<div class="err">${esc(lastErr ? lastErr.message : 'Kein Stream gefunden')}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn" id="retry">Nochmal</button>
        <a class="btn ghost" href="${esc(viewUrl())}" target="_blank" rel="noopener">Browser öffnen</a></div>`);
    $('#retry').onclick = () => start();
  }

  const proxied = (u, r) => '/api/hls?u=' + encodeURIComponent(u) + '&r=' + encodeURIComponent(r || '');

  function play(st, my) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const ok = () => { if (settled) return; settled = true; say(''); resolve(); };
      const fail = (m) => { if (settled) return; settled = true; stopPlayer(); reject(new Error(m)); };
      const onMeta = () => {
        if (startAt > 5 && startAt < (v.duration || 1e9) - 20) v.currentTime = startAt;
        startAt = 0;
        v.play().catch(() => {});
        ok();
      };
      v.onloadedmetadata = onMeta;
      v.onerror = () => fail('Das Video konnte nicht abgespielt werden.');
      if (st.m3u8 && window.Hls && Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 40, enableWorker: true });
        hls.loadSource(proxied(st.m3u8, st.referer));
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { if (!settled) onMeta(); });
        hls.on(Hls.Events.ERROR, (_e, d) => {
          if (!d.fatal) return;
          if (!settled) return fail('Der Stream ist nicht erreichbar (' + (d.details || 'Fehler') + ').');
          if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        });
      } else if (st.m3u8 && v.canPlayType('application/vnd.apple.mpegurl')) {
        v.src = proxied(st.m3u8, st.referer);
      } else if (st.mp4) {
        v.src = proxied(st.mp4, st.referer);
      } else {
        return fail('Kein abspielbares Format.');
      }
      setTimeout(() => fail('Der Stream startet nicht (Zeitüberschreitung).'), 45000);
    }).then(() => {
      playTimer = setInterval(() => {
        if (v.paused || !v.duration) return;
        const p = store.get('pos', {});
        p[posKey] = v.currentTime;
        store.set('pos', p);
        const recent = store.get('recent', []).filter((r) => !(r.slug === slug));
        recent.unshift({ slug, title: s.title, season, ep, pos: v.currentTime });
        store.set('recent', recent.slice(0, 12));
        if (v.currentTime / v.duration > 0.85) { const sn = store.get('seen', {}); sn[posKey] = 1; store.set('seen', sn); }
      }, 5000);
      v.onended = () => {
        const sn = store.get('seen', {}); sn[posKey] = 1; store.set('seen', sn);
        const p = store.get('pos', {}); delete p[posKey]; store.set('pos', p);
        const n = $('#next'); if (n) location.hash = n.getAttribute('href');
      };
    });
  }

  paintChips();
  start();
}

// ---------- Routing ----------
function route() {
  stopPlayer();
  document.title = 'Sina';
  const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  if (parts[0] === 'search' && parts[1]) return viewSearch(parts.slice(1).join('/'));
  if (parts[0] === 's' && parts[1]) return viewSeries(parts[1], parts[2]);
  if (parts[0] === 'w' && parts[3]) return viewWatch(parts[1], parts[2], parts[3]);
  return viewHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
