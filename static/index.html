<!doctype html>
<html lang="de" class="nina-skin-on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101414">
<meta name="referrer" content="no-referrer">
<title>Sina</title>
<link rel="stylesheet" href="skin.css">
<link rel="stylesheet" href="player.css">
<link rel="stylesheet" href="tv.css">
<style>
  html, body { margin: 0; background: hsl(186 10% 7%); }
  #nina-skin .sina-ph-msg { position: relative; display: grid; gap: 12px; justify-items: center; text-align: center; padding: 0 24px; color: #fff; }
  #nina-skin .sina-ph-msg .spin { width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(255,255,255,.22); border-top-color: var(--primary); animation: sinaSpin 1s linear infinite; }
  #nina-skin .sina-ph-msg small { color: rgba(255,255,255,.75); max-width: 460px; }
  #nina-skin .sina-ph-msg .err { color: #ffb4ab; font-weight: 600; }
  #nina-skin .sina-ph-msg .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #nina-skin .sina-ph-msg .ns-btn, #nina-skin .sina-ph-msg .ns-tonal { text-decoration: none; }
  @keyframes sinaSpin { to { transform: rotate(360deg); } }
  #nina-skin .ns-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ffb4ab; margin-right: 8px; }
  #nina-skin .ns-dot.up { background: #81c784; }
  #nina-skin .ns-ep .bar { display: block; height: 3px; border-radius: 3px; background: var(--outline-variant); margin-top: 4px; overflow: hidden; }
  #nina-skin .ns-ep .bar b { display: block; height: 100%; background: var(--primary); }
.sina-card { background: var(--surface-c); border-radius: var(--r-l); padding: 22px 24px; margin: 0 0 18px; max-width: 760px; }
  #nina-skin .sina-card h2 { font-size: 20px; margin: 0 0 6px; }
  #nina-skin .sina-card p { color: var(--on-surface-variant); margin: 6px 0 14px; }
  #nina-skin .sina-card textarea { width: 100%; min-height: 130px; resize: vertical; border: 1px solid var(--outline-variant); border-radius: var(--r-m); background: var(--surface-c-low); color: var(--on-surface); padding: 12px 14px; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #nina-skin .sina-card textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
  #nina-skin .sina-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0 0; }
  #nina-skin .sina-kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 12px 0 0; }
  #nina-skin .sina-kv span:nth-child(odd) { color: var(--on-surface-variant); }
  #nina-skin .sina-msg { margin-top: 12px; padding: 10px 14px; border-radius: var(--r-m); background: var(--surface-c-high); }
  #nina-skin .sina-msg.ok { background: var(--primary-container); color: var(--on-primary-container); }
  #nina-skin .sina-msg.bad { background: #5a2323; color: #ffdad6; }
#nina-skin [hidden] { display: none !important; }
  #nina-skin .sina-profiles { animation: sinaFade .35s var(--ease) both; }
  #nina-skin .sina-profiles h1 { animation: sinaRise .55s var(--spring-soft) both; }
  #nina-skin .sina-p { animation: sinaPop .6s var(--spring) both; animation-delay: calc(var(--i, 0) * 70ms + 90ms); }
  #nina-skin .sina-profiles.leaving { animation: sinaFadeOut .38s var(--ease) .14s both; pointer-events: none; }
  #nina-skin .sina-profiles.leaving .sina-p { animation: none; transition: opacity .3s var(--ease), transform .3s var(--ease); }
  #nina-skin .sina-profiles.leaving .sina-p:not(.picked) { opacity: .2; transform: scale(.9); }
  #nina-skin .sina-profiles.leaving .sina-p.picked .av { border-radius: 50%; transform: scale(1.16); }
  #nina-skin .ns-main.sina-enter { animation: sinaRise .5s var(--spring-soft) both; }
  @keyframes sinaFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sinaFadeOut { to { opacity: 0; transform: scale(1.04); } }
  @keyframes sinaRise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes sinaPop { from { opacity: 0; transform: translateY(20px) scale(.85); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #nina-skin .sina-profiles, #nina-skin .sina-profiles *, #nina-skin .ns-main.sina-enter { animation: none !important; transition: none !important; } }
  /* Fernseher-Knopf am Handy: im Kopf als kleiner Knopf sichtbar lassen */
  @media (max-width: 760px) { #nina-skin .ns-acts #castBtn:not([hidden]) { display: inline-flex; padding: 0 12px; } #nina-skin .ns-acts #castBtn span { display: none; } }
  #nina-skin .sina-profiles { position: fixed; inset: 0; z-index: 200; display: grid; align-content: center; justify-items: center; gap: 36px; padding: 24px; background: var(--surface); overflow: auto; }
  #nina-skin .sina-profiles h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 700; }
  #nina-skin .sina-pgrid { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; max-width: 960px; }
  #nina-skin .sina-p { display: grid; justify-items: center; gap: 12px; background: none; border: 0; cursor: pointer; color: var(--on-surface-variant); font-size: 17px; padding: 4px; }
  #nina-skin .sina-p .av, #nina-skin .sina-me .av { display: grid; place-items: center; font-weight: 800; background: hsl(var(--ph) 55% 72%); color: hsl(var(--ph) 70% 16%); }
  #nina-skin .sina-p .av { width: 132px; height: 132px; border-radius: 34px; font-size: 58px; transition: border-radius .45s var(--spring), transform .35s var(--spring); }
  #nina-skin .sina-p:hover .av, #nina-skin .sina-p:focus-visible .av { border-radius: 50%; transform: scale(1.07); }
  #nina-skin .sina-p:hover, #nina-skin .sina-p:focus-visible { color: var(--on-surface); outline: 0; }
  #nina-skin .sina-p small { font-size: 12px; opacity: .7; margin-top: -6px; }
  #nina-skin .sina-me { width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  #nina-skin .sina-me .av { width: 36px; height: 36px; border-radius: 12px; font-size: 17px; transition: border-radius .4s var(--spring); }
  #nina-skin .sina-me:hover .av { border-radius: 50%; }
  @media (max-width: 600px) { #nina-skin .sina-p .av { width: 96px; height: 96px; font-size: 42px; border-radius: 28px; } #nina-skin .sina-pgrid { gap: 16px; } }
</style>
</head>
<body>
<div id="nina-skin">
  <header class="ns-top">
    <a class="ns-brand" href="#/"><span class="ns-logo">S</span><span><b>Sina</b><small>AniWorld</small></span></a>
    <nav class="ns-nav" id="nav"></nav>
    <div class="ns-search"><label id="searchIcon"></label><div class="ns-suggest"></div></div>
    <button type="button" class="ns-vpn" id="vpnChip" title="Server und Browser: gleiche IP? (klicken: prüfen)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg><span class="dot"></span><span class="t">IP …</span></button>
    <div class="ns-acts"><button type="button" class="ns-tonal" id="castBtn" hidden title="Auf Fernseher weiter schauen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg><span>Fernseher</span></button><button type="button" class="sina-me" id="profileBtn" title="Profil wechseln"></button><a class="ns-icon" id="settingsLink" href="#/settings" title="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></a><a class="ns-tonal" id="browserLink" href="#" target="_blank" rel="noopener" title="Der Browser im Container (Schutzprüfungen lösen)"></a></div>
  </header>
  <main class="ns-main" id="main"></main>
  <div class="sina-profiles" id="profiles" hidden></div>
  <nav class="ns-bnav" id="bnav"></nav>
</div>

<script src="hls.min.js"></script>
<script src="shim.js"></script>
<script src="player.js"></script>
<script src="tv.js"></script>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = (d) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + d + '"/></svg>';
const I = {
  search: svg('M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'),
  chev: svg('M7 10l5 5 5-5z'),
  chevUp: svg('M7 14l5-5 5 5z'),
  bookmark: svg('M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z'),
  check: svg('M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'),
  play: svg('M8 5v14l11-7z'),
  clock: svg('M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-8 3.58-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z'),
  prev: svg('M6 6h2v12H6zm3.5 6 8.5 6V6z'),
  next: svg('M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z'),
  web: svg('M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.93 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 0 1 5.08 16zm2.95-8H5.08a7.99 7.99 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z'),
  tv: svg('M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z'),
};

// ---------- Hilfen ----------
// Speicher: pro Profil getrennt (Schlüssel „sina:<profil>:<name>“). Alles Profil-Eigene wird mit dem Server abgeglichen.
let P = null;               // gewähltes Profil (id)
let PROFILES = [
  { id: 'simon', name: 'Simon', hue: 186, saved: true }, { id: 'melanie', name: 'Melanie', hue: 330, saved: true },
  { id: 'eltern', name: 'Eltern', hue: 40, saved: true }, { id: 'martin', name: 'Martin', hue: 140, saved: true },
  { id: 'gast', name: 'Gast', hue: 220, saved: false },
];
const store = {
  get(k, d) { try { const v = localStorage.getItem('sina:' + P + ':' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sina:' + P + ':' + k, JSON.stringify(v)); } catch {} },
};
// geräteweit (nicht pro Profil): Cover-Zwischenspeicher
const gstore = {
  get(k, d) { try { const v = localStorage.getItem('sina:g:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sina:g:' + k, JSON.stringify(v)); } catch {} },
};
const profile = () => PROFILES.find((x) => x.id === P) || PROFILES[0];
const pPrefix = () => 'sina:' + P + ':';
function localKeys() { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(pPrefix())) out.push(k); } return out; }
function clearLocalProfile() { const keys = localKeys(); window.__sinaDirty = null; keys.forEach((k) => localStorage.removeItem(k)); }
function collectState() {
  const out = {};
  for (const k of localKeys()) out[k.slice(pPrefix().length)] = localStorage.getItem(k);
  // alte Abspielpositionen aufräumen
  const pos = Object.keys(out).filter((k) => k.startsWith('nina_ep_pos_'));
  if (pos.length > 500) {
    const at = (k) => { try { return JSON.parse(out[k]).at || 0; } catch { return 0; } };
    pos.sort((a, b) => at(a) - at(b)).slice(0, pos.length - 400).forEach((k) => delete out[k]);
  }
  return out;
}
let pushTimer = null;
function pushState(keepalive) {
  clearTimeout(pushTimer);
  if (!P || !profile().saved) return;
  fetch('/api/state?p=' + P, { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(collectState()), keepalive: !!keepalive }).catch(() => {});
}
const schedulePush = () => { clearTimeout(pushTimer); pushTimer = setTimeout(() => pushState(false), 2000); };
window.addEventListener('pagehide', () => pushState(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) pushState(true); });

const main = $('#main');
let cfg = { viewUrl: '', viewPort: '8081', browserUp: false };

async function api(path, params) {
  const r = await fetch('/api/' + path + (params ? '?' + new URLSearchParams(params) : ''));
  let j = null;
  try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error((j && j.error) || 'Fehler ' + r.status); e.needsBrowser = !!(j && j.needsBrowser); throw e; }
  return j;
}
const imgUrl = (p) => (!p ? '' : p.startsWith('/public/') ? '/api/img?p=' + encodeURIComponent(p) : p);
const viewUrl = () => cfg.viewUrl || `${location.protocol}//${location.hostname}:${cfg.viewPort}/`;
const H = {
  show: (slug) => `#/anime/stream/${slug}`,
  season: (slug, key) => (key === 'filme' ? `#/anime/stream/${slug}/filme` : `#/anime/stream/${slug}/staffel-${key}`),
  ep: (slug, season, n, film) => (film ? `#/anime/stream/${slug}/filme/film-${n}` : `#/anime/stream/${slug}/staffel-${season}/episode-${n}`),
};
const fmtTime = (s) => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };

// Fortschritt (lokal im Browser)
const epKey = (slug, season, n, film) => `${slug}/${film ? 'f' : season}/${n}`;
function epState(slug, season, n, film) {
  const k = epKey(slug, season, n, film);
  const seen = store.get('seen', {})[k];
  const p = store.get('prog', {})[k];
  if (seen || (p && p.frac >= 0.8)) return { status: 'w', frac: 1 };
  if (p && p.frac > 0.02) return { status: 's', frac: p.frac };
  return null;
}

// ---------- Rahmen: Navigation, Suche ----------
const NAV = [
  ['#/', 'Start', 'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z'],
  ['#/animes', 'Alle Animes', 'M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z'],
  ['#/beliebt', 'Beliebt', 'M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z'],
  ['#/kalender', 'Kalender', 'M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z'],
];
function paintNav(route) {
  const on = (h) => (h === '#/' ? route.name === 'home' : route.name === { '#/animes': 'all', '#/beliebt': 'popular', '#/kalender': 'calendar' }[h]);
  $('#nav').innerHTML = NAV.map(([h, t]) => `<a href="${h}" class="${on(h) ? 'on' : ''}">${t}</a>`).join('');
  $('#bnav').innerHTML = NAV.map(([h, t, d]) => `<a href="${h}" class="${on(h) ? 'on' : ''}"><span class="ind">${svg(d)}</span>${t === 'Alle Animes' ? 'Animes' : t}</a>`).join('') +
    `<a href="${esc(viewUrl())}" target="_blank" rel="noopener"><span class="ind">${I.web}</span>Browser</a>`;
}
function paintBrowser() {
  const a = $('#browserLink');
  a.href = viewUrl();
  a.innerHTML = `<span class="ns-dot ${cfg.browserUp ? 'up' : ''}"></span>${I.web}<span>Browser</span>`;
}
async function checkVpn() {
  const b = $('#vpnChip');
  b.className = 'ns-vpn busy';
  $('.t', b).textContent = 'Prüfe …';
  try {
    const v = await api('vpn');
    const cls = v.same ? 'ok' : v.server && v.browser ? 'bad' : 'warn';
    b.className = 'ns-vpn ' + cls;
    $('.t', b).textContent = v.same ? (v.proxy ? 'VPN · gleiche IP' : 'Gleiche IP') : v.server && v.browser ? 'IP verschieden' : 'IP ?';
    b.title = `Server: ${v.server || '?'} · Browser: ${v.browser || '?'}` + (v.same ? '' : ' – Videos können abgelehnt werden. Beide müssen über denselben Proxy/VPN gehen.') + ' (klicken: neu prüfen)';
  } catch { b.className = 'ns-vpn warn'; $('.t', b).textContent = 'IP ?'; }
}
$('#vpnChip').addEventListener('click', checkVpn);
async function loadConfig() {
  try { cfg = await api('config'); } catch {}
  paintBrowser();
}

// Suche mit Vorschlägen
(function setupSearch() {
  $('#searchIcon').innerHTML = I.search + '<input type="search" placeholder="Anime suchen …" autocomplete="off" spellcheck="false">';
  const input = $('.ns-search input'), box = $('.ns-suggest');
  let timer = null, seq = 0, sel = -1;
  const paint = (list, q) => {
    if (!list.length) { box.innerHTML = `<div class="ns-sug"><small>Keine Treffer für „${esc(q)}“</small></div>`; box.classList.add('on'); return; }
    box.innerHTML = list.slice(0, 7).map((r, i) => `<a class="ns-sug" href="${H.show(r.slug)}" data-i="${i}"><span class="c" data-cover="${esc(r.slug)}"></span><span><b>${esc(r.title)}</b><small>${esc(r.description)}</small></span></a>`).join('') +
      `<a class="ns-sug-all" href="#/search/${encodeURIComponent(q)}">Alle ${list.length} Treffer anzeigen</a>`;
    box.classList.add('on');
    fillCovers(box);
  };
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    sel = -1;
    if (q.length < 2) { box.classList.remove('on'); return; }
    timer = setTimeout(async () => { const my = ++seq; try { const l = await api('search', { q }); if (my === seq) paint(l, q); } catch {} }, 250);
  });
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    const items = $$('.ns-sug[href]', box);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = Math.max(-1, Math.min(items.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1)));
      items.forEach((it, i) => it.classList.toggle('sel', i === sel));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const q = input.value.trim();
      box.classList.remove('on');
      if (sel >= 0 && items[sel]) location.hash = items[sel].getAttribute('href');
      else if (q) location.hash = '#/search/' + encodeURIComponent(q);
    } else if (e.key === 'Escape') { box.classList.remove('on'); input.blur(); }
  });
  for (const t of ['keyup', 'keypress']) input.addEventListener(t, (e) => e.stopPropagation());
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('.ns-search')) box.classList.remove('on'); }, true);
  box.addEventListener('click', () => box.classList.remove('on'));
  input.addEventListener('focus', () => { if (box.innerHTML && input.value.trim().length >= 2) box.classList.add('on'); });
  window.__searchInput = input;
})();

// Cover, die in Listen fehlen: eines pro Serienseite, nur für sichtbare Karten
const coverCache = gstore.get('covers', {});
let coverSave = null;
const coverBusy = new Map();
function coverFor(slug) {
  if (coverCache[slug] !== undefined) return Promise.resolve(coverCache[slug]);
  if (!coverBusy.has(slug)) {
    coverBusy.set(slug, api('series', { slug }).then((s) => s.cover || '').catch(() => '').then((c) => {
      coverCache[slug] = c;
      clearTimeout(coverSave);
      coverSave = setTimeout(() => {
        const keys = Object.keys(coverCache);
        if (keys.length > 3000) for (const k of keys.slice(0, keys.length - 2500)) delete coverCache[k];
        gstore.set('covers', coverCache);
      }, 800);
      coverBusy.delete(slug);
      return c;
    }));
  }
  return coverBusy.get(slug);
}
let coverIo = null, coverRunning = 0;
const coverQ = [];
function coverPump() {
  while (coverRunning < 3 && coverQ.length) {
    const el = coverQ.shift();
    if (!el.isConnected) continue;
    coverRunning++;
    coverFor(el.dataset.cover).then((src) => {
      coverRunning--;
      if (src && el.isConnected) {
        const img = new Image();
        img.alt = ''; img.decoding = 'async'; img.src = imgUrl(src);
        const ph = el.querySelector('.ph'); if (ph) ph.remove();
        el.appendChild(img);
      }
      coverPump();
    });
  }
}
function fillCovers(scope) {
  const els = $$('[data-cover]', scope).filter((e) => !e.dataset.done);
  const take = (el) => { if (el.dataset.done) return; el.dataset.done = '1'; coverQ.push(el); };
  if (typeof IntersectionObserver !== 'function') { els.forEach(take); coverPump(); return; }
  if (!coverIo) {
    coverIo = new IntersectionObserver((ents) => {
      for (const en of ents) if (en.isIntersecting) { coverIo.unobserve(en.target); take(en.target); }
      coverPump();
    }, { rootMargin: '400px 0px' });
  }
  els.forEach((el) => coverIo.observe(el));
}

// Kalender
function mergeDay(entries) {
  const map = new Map();
  for (const e of entries) {
    const k = e.slug + ':' + e.season + ':' + e.episode + ':' + (e.film ? 1 : 0);
    const cur = map.get(k);
    if (!cur) { map.set(k, { ...e, langs: e.lang ? [e.lang] : [] }); continue; }
    if (e.lang && !cur.langs.includes(e.lang)) cur.langs.push(e.lang);
    cur.out = cur.out || e.out;
    if (!cur.img && e.img) cur.img = e.img;
    if (e.time && (!cur.time || e.time < cur.time)) cur.time = e.time;
  }
  return [...map.values()].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
}

    fillCovers($('.ns-cal-list'));
  };
  main.innerHTML = `<h1 class="ns-h1">Kalender</h1><p class="ns-sub">${total} Folgen in den nächsten ${days.length} Tagen · Uhrzeiten wie bei AniWorld</p>
    <div class="ns-cal"><div class="ns-cal-days">${days.map((x, i) => `<button class="ns-chip ${i === pick ? 'on' : ''}" data-calday="${i}">${esc(x.label)}<span class="cnt">${x.entries.length}</span></button>`).join('')}</div><div class="ns-cal-list"></div></div>`;
  $('.ns-cal-days').addEventListener('click', (e) => { const b = e.target.closest('[data-calday]'); if (b) { pick = +b.dataset.calday; paintDay(); } });

      $('#vpnIps').innerHTML = `<div class="sina-kv"><span>Server</span><span>${esc(v.server || '?')}</span><span>Browser</span><span>${esc(v.browser || '?')}</span></div>
        <div class="sina-msg ${v.same ? 'ok' : 'bad'}">${v.same ? 'Gleiche IP. Videos werden angenommen.' : v.server && v.browser ? 'Die IPs sind verschieden. Videos können abgelehnt werden.' : 'Eine der beiden IPs war nicht abrufbar.'}</div>`;
    } catch (e) { $('#vpnIps').innerHTML = `<div class="sina-msg bad">${esc(e.message)}</div>`; }
  });
  if (typeof sinaDeviceBind === 'function') sinaDeviceBind();
  loadStatus();
}

// ---------- Folge + Player ----------
const player = { token: 0, hls: null, video: null };
function teardown() {
  player.token++;
  if (player.hls) { try { player.hls.destroy(); } catch {} player.hls = null; }
  if (player.video) { try { player.video.pause(); player.video.removeAttribute('src'); player.video.load(); } catch {} player.video = null; }
  window.__sinaCtx = null; window.__sinaSkip = null; window.__sinaOnProgress = null;
}
const proxied = (u, r) => '/api/hls?u=' + encodeURIComponent(u) + '&r=' + encodeURIComponent(r || '');

async function viewEpisode(slug, key, num) {
  const my = ++viewSeq;
  main.innerHTML = spinner();
  const film = key === 'filme';
  let d, info;
  try {
    [d, info] = await Promise.all([loadShow(slug, key), api('episode', { slug, season: key, episode: String(num) })]);
  } catch (e) { if (my === viewSeq) main.innerHTML = errBox(e); return; }
  if (my !== viewSeq) return;
  const { p, eps } = d;
  const season = film ? 0 : Number(key);
  const idx = eps.findIndex((e) => e.n === num);
  const prev = idx > 0 ? eps[idx - 1] : null, next = idx >= 0 && idx < eps.length - 1 ? eps[idx + 1] : null;
  const row = eps[idx] || {};
  const de = info.de || row.title || '', en = info.en || row.titleEn || '';
  const label = film ? 'Film ' + num : 'Staffel ' + season + ' · Folge ' + num;
  const k = epKey(slug, season, num, film);
  const st = epState(slug, season, num, film);
  document.title = `${p.title} – ${label} – Sina`;
  const back = imgUrl(p.backdrop || p.cover);

  main.innerHTML = `<div class="ns-watch">
    <div>
      <div class="ns-crumb">${p.cover ? `<img src="${esc(imgUrl(p.cover))}" alt="" decoding="async">` : ''}<a href="${H.season(slug, d.key)}"><b>${esc(p.title)}</b><small>${esc(label)}</small></a></div>
      <div class="ns-player"><div class="ns-player-ph" id="ph">${back ? `<img src="${esc(back)}" alt="" decoding="async">` : ''}<div class="sina-ph-msg" id="phmsg"></div></div><div class="inSiteWebStream" data-a16-active="true" id="stream"></div></div>
      <h1 class="ns-ep-title">${esc(de || en || label)}</h1>
      ${en && de ? `<p class="ns-ep-sub">${esc(en)}</p>` : ''}
      ${info.desc ? `<p class="ns-ep-sub">${esc(info.desc)}</p>` : ''}
      <div class="ns-ep-acts">
        ${prev ? `<a class="ns-tonal" href="${H.ep(slug, season, prev.n, film)}">${I.prev}Vorherige</a>` : ''}
        ${next ? `<a class="ns-btn" href="${H.ep(slug, season, next.n, film)}">Nächste Folge${I.next}</a>` : ''}
        <span class="sp"></span>
        <button class="ns-tonal" id="castEp" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>Auf Fernseher weiter schauen</button>
        ${film ? '' : `<button class="${st && st.status === 'w' ? 'ns-btn' : 'ns-tonal'}" data-tick="${esc(k)}">${I.check}${st && st.status === 'w' ? 'Gesehen' : 'Als gesehen markieren'}</button>`}
      </div>
      <div class="ns-opts" id="opts"></div>
    </div>
    <aside class="ns-side">
      <div class="ns-side-h"><b>${esc(p.title)}</b><div class="ns-muted">${eps.length} ${film ? 'Filme' : 'Folgen'}</div></div>
      ${seasonChips(slug, p, d.key)}
      <div class="ns-eps">${eps.map((e) => epRow(slug, e, e.n === num)).join('')}</div>
    </aside></div>`;
  const curRow = $('.ns-side .ns-ep.cur');
  if (curRow) curRow.scrollIntoView({ block: 'center' });
  if (typeof sinaEpisodeRendered === 'function') sinaEpisodeRendered();

  // Kontext für den Player (Titel, nächste Folge, Intro/Outro)
  window.__sinaCtx = {
    series: p.title, season: film ? 1 : season, episode: num, movie: film, title: de || en || '',
    next: next ? { href: H.ep(slug, season, next.n, film), label: film ? 'Film ' + next.n : 'Staffel ' + season + ' · Folge ' + next.n } : null,
  };
  window.__sinaOnProgress = (dta) => {
    if (!dta || !dta.duration) return;
    const prog = store.get('prog', {});
    const frac = Math.min(1, dta.position / dta.duration);
    prog[k] = { pos: dta.position, frac, at: Date.now() };
    const keys = Object.keys(prog);
    if (keys.length > 600) for (const x of keys.sort((a, b) => prog[a].at - prog[b].at).slice(0, 100)) delete prog[x];
    store.set('prog', prog);
    const recent = store.get('recent', []).filter((r) => r.slug !== slug);
    recent.unshift({ slug, title: p.title, cover: p.cover, season, ep: num, film });
    store.set('recent', recent.slice(0, 14));
  };

  // Sprache + Hoster
  let lang = store.get('lang', null);
  if (!info.langs.some((l) => l.key === lang)) lang = (info.langs.find((l) => l.on) || info.langs[0] || { key: (info.hosters[0] || {}).lang }).key;
  let hosterId = null, mode = 'aw', anipm = null, anipmLang = null;
  const hostersFor = (lk) => info.hosters.filter((h) => h.lang === lk);
  const paintOpts = () => {
    const lis = hostersFor(lang);
    const pm = anipm && anipm.found ? `
      ${anipm.hasDub ? `<button type="button" class="ns-chip ${mode === 'pm' && anipmLang === 'dub' ? 'on' : ''}" data-anipm-lang="dub">🇬🇧 Eng-Dub <small style="opacity:.75;margin-left:4px">ani.pm</small></button>` : ''}
      ${anipm.hasSub ? `<button type="button" class="ns-chip ${mode === 'pm' && anipmLang === 'sub' ? 'on' : ''}" data-anipm-lang="sub">🇬🇧 Eng-Sub <small style="opacity:.75;margin-left:4px">ani.pm</small></button>` : ''}` : '';
    $('#opts').innerHTML = `
      ${(info.langs.length > 1 || pm) ? `<div><h3>Sprache</h3><div class="row">${info.langs.map((l) => `<button class="ns-chip ${mode === 'aw' && l.key === lang ? 'on' : ''}" data-lang="${esc(l.key)}">${esc(l.label)}</button>`).join('')}${pm}</div></div>` : ''}
      ${lis.length && mode === 'aw' ? `<div><h3>Hoster</h3><div class="row">${lis.map((h) => `<button class="ns-chip ${h.id === hosterId ? 'on' : ''}" data-hoster="${esc(h.id)}">${esc(h.name)}</button>`).join('')}</div></div>` : ''}`;
  };

  const ph = $('#ph'), phmsg = $('#phmsg');
  const say = (html) => { ph.classList.remove('hidden'); ph.style.removeProperty('display'); phmsg.innerHTML = html; };
  const sayLoad = (t, sub) => say(`<div class="spin"></div><b>${esc(t)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}`);
  const sayErr = (msg) => say(`<div class="err">${esc(msg)}</div><div class="row"><button class="ns-btn" data-ns="retry">Nochmal</button><a class="ns-tonal" href="${esc(viewUrl())}" target="_blank" rel="noopener">${I.web}Browser öffnen</a></div>`);

  async function run(fn) {
    teardown();
    window.__sinaCtx = { ...window.__sinaCtxKeep };
    const mine = player.token;
    try { await fn(mine); } catch (e) { if (mine === player.token) sayErr(e.message); }
  }
  window.__sinaCtxKeep = window.__sinaCtx;
  window.__sinaOnProgressKeep = window.__sinaOnProgress;

  function startAw(forceId) {
    return run(async (mine) => {
      window.__sinaOnProgress = window.__sinaOnProgressKeep;
      mode = 'aw'; anipmLang = null;
      const list = hostersFor(lang);
      if (!list.length) throw new Error('Für diese Sprache gibt es keine Hoster.');
      const order = [...list].sort((a, b) => (/voe/i.test(b.name) ? 1 : 0) - (/voe/i.test(a.name) ? 1 : 0));
      const queue = forceId ? order.filter((h) => h.id === forceId) : order;
      let last = null;
      for (const h of queue) {
        if (mine !== player.token) return;
        hosterId = h.id; paintOpts();
        sayLoad('Hoster ' + h.name + ' wird geöffnet …', 'Das kann bis zu einer halben Minute dauern.');
        try {
          const s = await api('stream', { id: h.id });
          if (mine !== player.token) return;
          window.__sinaSkip = null;
          return await playStream(s, mine);
        } catch (e) { last = e; if (e.needsBrowser) break; }
      }
      throw last || new Error('Kein Stream gefunden');
    });
  }
  function startPm(l) {
    return run(async (mine) => {
      window.__sinaOnProgress = window.__sinaOnProgressKeep;
      mode = 'pm'; anipmLang = l; hosterId = null; paintOpts();
      sayLoad('ani.pm wird geöffnet …', 'Englische Version, das kann etwas dauern.');
      const s = await api('anipm/stream', { id: String(anipm.animeId), routeId: anipm.routeId || '', source: anipm.source || 'settlar', ep: String(num), lang: l });
      if (mine !== player.token) return;
      window.__sinaSkip = s.skip || null;
      return await playStream(s, mine);
    });
  }

  function playStream(s, mine) {
    return new Promise((resolve, reject) => {
      const holder = $('#stream');
      holder.innerHTML = '';
      const v = document.createElement('video');
      v.setAttribute('playsinline', '');
      holder.appendChild(v);
      player.video = v;
      let settled = false;
      const done = () => { if (settled) return; settled = true; ph.classList.add('hidden'); resolve(); };
      const fail = (m) => { if (settled) return; settled = true; reject(new Error(m)); };
      const onMeta = () => { v.play().catch(() => {}); done(); };
      v.addEventListener('loadedmetadata', onMeta, { once: true });
      v.addEventListener('error', () => fail('Das Video konnte nicht abgespielt werden.'), { once: true });
      if (s.m3u8 && window.Hls && Hls.isSupported()) {
        const hls = new Hls({ maxBufferLength: 60, enableWorker: true });
        player.hls = hls;
        v.__hlsInstance = hls;
        hls.loadSource(proxied(s.m3u8, s.referer));
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { if (!settled) onMeta(); });
        hls.on(Hls.Events.ERROR, (_e, e) => {
          if (!e.fatal) return;
          if (!settled) return fail('Der Stream ist nicht erreichbar (' + (e.details || 'Fehler') + ').');
          if (e.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if (e.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        });
      } else if (s.m3u8 && v.canPlayType('application/vnd.apple.mpegurl')) {
        v.src = proxied(s.m3u8, s.referer);
      } else if (s.mp4) {
        v.src = proxied(s.mp4, s.referer);
      } else { return fail('Kein abspielbares Format.'); }
      setTimeout(() => { if (mine === player.token) fail('Der Stream startet nicht (Zeitüberschreitung).'); }, 45000);
    });
  }

  main.onclick = (e) => {
    const t = e.target;
    const tick = t.closest('[data-tick]');
    if (tick) {
      e.preventDefault(); e.stopPropagation();
      const seen = store.get('seen', {}), prog = store.get('prog', {});
      const key2 = tick.dataset.tick;
      const was = (seen[key2] || (prog[key2] && prog[key2].frac >= 0.8));
      if (was) { delete seen[key2]; if (prog[key2]) delete prog[key2]; } else seen[key2] = 1;
      store.set('seen', seen); store.set('prog', prog);
      route();
      return;
    }
    const lg = t.closest('[data-lang]');
    if (lg) { lang = lg.dataset.lang; store.set('lang', lang); startAw(); return; }
    const hs = t.closest('[data-hoster]');
    if (hs) { startAw(hs.dataset.hoster); return; }
    const pm = t.closest('[data-anipm-lang]');
    if (pm) { startPm(pm.dataset.anipmLang); return; }
    if (t.closest('[data-ns="retry"]')) { mode === 'pm' && anipmLang ? startPm(anipmLang) : startAw(); return; }
    if (t.closest('[data-ns="desc"]')) { descOpen = !descOpen; $('.ns-desc').classList.toggle('open', descOpen); }
  };

  paintOpts();
  startAw();
  // ani.pm: gibt es die Folge auch dort (Eng-Dub / Eng-Sub)?
  api('anipm/check', { series: p.title, season: String(film ? 1 : season), episode: String(num), alts: p.alt.slice(0, 4).join('|') })
    .then((r) => { if (my === viewSeq) { anipm = r; paintOpts(); } })
    .catch(() => {});
}

// ---------- Profile ----------
const avatar = (p) => `<span class="av" style="--ph:${p.hue}">${esc(p.name.charAt(0))}</span>`;
function paintProfileBtn() {
  const b = $('#profileBtn'), p = profile();
  b.innerHTML = avatar(p);
  b.title = 'Profil: ' + p.name + ' (klicken zum Wechseln)';
}
async function selectProfile(id, keepOverlay) {
  if (P && P !== id) { pushState(false); if (!profile().saved) clearLocalProfile(); }
  P = id;
  window.__sinaProfile = id;
  try { sessionStorage.setItem('sina:profile', id); } catch {}
  const p = profile();
  document.documentElement.style.setProperty('--ns-h', p.hue);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', `hsl(${p.hue} 10% 7%)`);
  if (!p.saved) {
    clearLocalProfile();                       // Gast: immer leer anfangen
  } else {
    // Stand vom Server holen (gilt für alle Geräte). Ist er leer, bleibt der lokale Stand und wird hochgeladen.
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch('/api/state?p=' + id, { signal: ctl.signal });
      clearTimeout(t);
      const st = r.ok ? await r.json() : null;
      if (st && Object.keys(st).length) {
        clearLocalProfile();
        for (const [k, v] of Object.entries(st)) localStorage.setItem(pPrefix() + k, v);
      } else if (st) { setTimeout(() => pushState(false), 500); }
    } catch {}
  }
  window.__sinaDirty = p.saved ? schedulePush : null;
  paintProfileBtn();
  if (!keepOverlay) hideProfiles();
  if (typeof sinaOnProfile === 'function') sinaOnProfile();
}
function hideProfiles() {
  const box = $('#profiles');
  box.classList.remove('leaving');
  box.hidden = true;
  document.body.style.overflow = '';
}
let picking = false;
function showProfiles() {
  const box = $('#profiles');
  picking = false;
  box.classList.remove('leaving');
  box.innerHTML = `<h1>Wer schaut?</h1><div class="sina-pgrid">${PROFILES.map((p, i) => `<button type="button" class="sina-p" style="--i:${i}" data-p="${esc(p.id)}">${avatar(p)}<b>${esc(p.name)}</b>${p.saved ? '' : '<small>nichts wird gespeichert</small>'}</button>`).join('')}</div>`;
  box.hidden = false;
  document.body.style.overflow = 'hidden';
  const cur = P && $(`.sina-p[data-p="${P}"]`, box);
  (cur || $('.sina-p', box)).focus({ preventScroll: true });
  box.onclick = async (e) => {
    const b = e.target.closest('[data-p]');
    if (!b || picking) return;
    picking = true;
    box.classList.add('leaving');
    b.classList.add('picked');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    await Promise.all([selectProfile(b.dataset.p, true), new Promise((r) => setTimeout(r, reduced ? 0 : 480))]);
    hideProfiles();
    picking = false;
    main.classList.remove('sina-enter'); void main.offsetWidth; main.classList.add('sina-enter');
    route();
  };
}
$('#profileBtn').addEventListener('click', () => { teardown(); showProfiles(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && P && !picking && !$('#profiles').hidden) { hideProfiles(); route(); } });

// ---------- Routing ----------
function parseRoute() {
  const path = decodeURIComponent((location.hash || '').replace(/^#/, '').split('?')[0]).replace(/\/+$/, '');
  const parts = path.split('/').filter(Boolean);
  if (!parts.length) return { name: 'home' };
  if (parts[0] === 'search' && parts[1]) return { name: 'search', q: parts.slice(1).join('/') };
  if (parts[0] === 'animes') return { name: 'all' };
  if (parts[0] === 'beliebt') return { name: 'popular' };
  if (parts[0] === 'kalender') return { name: 'calendar' };
  if (parts[0] === 'settings') return { name: 'settings' };
  if (parts[0] === 'anime' && parts[1] === 'stream' && parts[2]) {
    const slug = parts[2];
    const sm = /^staffel-(\d+)$/.exec(parts[3] || '');
    const em = /^episode-(\d+)$/.exec(parts[4] || '');
    const fm = /^film-(\d+)$/.exec(parts[4] || '');
    if (sm && em) return { name: 'episode', slug, key: sm[1], num: +em[1] };
    if (parts[3] === 'filme' && fm) return { name: 'episode', slug, key: 'filme', num: +fm[1] };
    if (sm) return { name: 'show', slug, key: sm[1] };
    if (parts[3] === 'filme') return { name: 'show', slug, key: 'filme' };
    return { name: 'show', slug };
  }
  return { name: 'home' };
}
function route() {
  if (!P) return;
  teardown();
  main.onclick = null;
  document.title = 'Sina';
  const r = parseRoute();
  paintNav(r);
  if (r.name !== 'search') window.__searchInput.value = '';
  scrollTo(0, 0);
  if (r.name === 'home') return viewHome();
  if (r.name === 'search') return viewSearch(r.q);
  if (r.name === 'all') return viewAll();
  if (r.name === 'popular') return viewPopular();
  if (r.name === 'calendar') return viewCalendar();
  if (r.name === 'settings') return viewSettings();
  if (r.name === 'show') return viewShow(r.slug, r.key);
  if (r.name === 'episode') return viewEpisode(r.slug, r.key, r.num);
}
// Beschreibung ein-/ausklappen und Haken in der Serienansicht
document.addEventListener('click', (e) => {
  if (parseRoute().name !== 'show') return;
  const more = e.target.closest('[data-ns="desc"]');
  if (more) { descOpen = !descOpen; $('.ns-desc').classList.toggle('open', descOpen); more.innerHTML = descOpen ? 'Weniger anzeigen' + I.chevUp : 'Mehr anzeigen' + I.chev; return; }
  const tick = e.target.closest('[data-tick]');
  if (tick) {
    e.preventDefault(); e.stopPropagation();
    const seen = store.get('seen', {}), prog = store.get('prog', {});
    const k = tick.dataset.tick;
    if (seen[k] || (prog[k] && prog[k].frac >= 0.8)) { delete seen[k]; delete prog[k]; } else seen[k] = 1;
    store.set('seen', seen); store.set('prog', prog);
    route();
  }
}, true);
window.addEventListener('hashchange', route);
loadConfig();
setInterval(loadConfig, 30000);
setTimeout(checkVpn, 6000);
(async function boot() {
  try { const r = await fetch('/api/profiles'); if (r.ok) PROFILES = await r.json(); } catch {}
  let last = null;
  try { last = sessionStorage.getItem('sina:profile'); } catch {}
  if (last && PROFILES.some((p) => p.id === last)) { await selectProfile(last); route(); }
  else { P = PROFILES[0].id; paintProfileBtn(); P = null; window.__sinaProfile = null; showProfiles(); }
})();
</script>
